name: Problem report
description: Report a defect in the shared standard or community files
title: "[Problem]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities, credentials, or private data here. Follow SECURITY.md instead.
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What should the standard or template require or produce?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happens instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal steps and identify the affected file or criterion.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Repository and environment
      description: Include the consuming repository, relevant version, operating system, runtime, or GitHub feature.
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Add links, screenshots, or logs with secrets and personal data removed.