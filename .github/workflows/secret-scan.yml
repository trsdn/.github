name: Secret scan

# Reusable workflow: scans the checked-out history with gitleaks. The caller
# decides when it runs (push, pull_request, schedule). It needs no secret beyond
# the default token. See docs/guides/reusable-workflows.md.

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label for the scan job.
        type: string
        default: ubuntu-latest
      fetch-depth:
        description: Commits to fetch; 0 scans the whole history.
        type: number
        default: 0

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
      # From outside the account, so pinned by commit SHA.
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
