name: Profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - scripts/profile_stats/**
      - .github/workflows/profile-stats.yml
      - requirements.txt

permissions:
  contents: write

concurrency:
  group: profile-stats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    name: Render account stats
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.STATS_TOKEN || github.token }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install generator dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Render SVG cards
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: python -m profile_stats account --username trsdn --theme both --out assets/profile-stats
      - name: Commit changed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- assets/profile-stats
          if git diff --cached --quiet -- assets/profile-stats; then
            echo "No profile stats changes."
            exit 0
          fi
          git commit -m "chore(stats): update profile stats"
          git push
