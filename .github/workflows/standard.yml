name: Standard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  consistency:
    name: Standard consistency
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Verify catalog, identifiers, and version
        run: python3 scripts/standard.py --check

  conformance:
    name: Conformance record
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Verify record and badge
        run: python3 scripts/conformance.py --check

  tagged:
    name: Recorded version is tagged
    # Only on the default branch. A version bump is merged before its tag
    # exists, so requiring the tag on the pull request would block every bump.
    # Between the merge and the tag this job is red, which is the point: the
    # recorded version is one no repository can be assessed against yet.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify the recorded standard version has a published tag
        run: python3 scripts/conformance.py --check --published-tags "$(git tag --list)"

  tests:
    name: Script tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Run the validation script tests
        run: python3 -m unittest discover -s tests -v

  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Verify internal links and anchors
        run: python3 scripts/links.py

  lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      # Ruff is pinned here rather than added to requirements.txt. It is a
      # development tool, and the scripts must keep running from a bare Python
      # installation with no dependencies at all.
      - name: Install Ruff
        run: python3 -m pip install --disable-pip-version-check ruff==0.14.5
      - name: Lint
        run: python3 -m ruff check .
      - name: Check formatting
        run: python3 -m ruff format --check .
