name: Repository stats

on:
  workflow_call:
    inputs:
      repository:
        description: Repository to render, in owner/name form. Defaults to the caller repository.
        required: false
        type: string
        default: ""
      output-dir:
        description: Directory in the caller repository where SVG cards are written.
        required: false
        type: string
        default: .github/stats
      theme:
        description: "Theme to render: light, dark, or both."
        required: false
        type: string
        default: both
      cards:
        description: Comma-separated card names. Currently supports repo-card.
        required: false
        type: string
        default: repo-card
      commit-message:
        description: Commit message used when generated cards change.
        required: false
        type: string
        default: "chore(stats): update repository stats"
      branch:
        description: Branch to update. Defaults to the checked-out ref or repository default branch.
        required: false
        type: string
        default: ""
    secrets:
      STATS_TOKEN:
        description: Optional token for private repositories or higher API limits.
        required: false

permissions:
  contents: write

concurrency:
  group: repo-stats-${{ inputs.repository || github.repository }}-${{ inputs.branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  render:
    name: Render repository stats
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.branch || github.ref_name }}
          token: ${{ secrets.STATS_TOKEN || github.token }}
          path: target
          fetch-depth: 0
      - name: Check out stats generator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: trsdn/.github
          ref: ${{ github.action_ref || 'main' }}
          token: ${{ secrets.STATS_TOKEN || github.token }}
          path: stats-source
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stats-source/requirements.txt
      - name: Install generator dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r stats-source/requirements.txt
      - name: Render SVG cards
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
          PYTHONPATH: ${{ github.workspace }}/stats-source/scripts
          TARGET_REPOSITORY: ${{ inputs.repository || github.repository }}
        run: |
          python -m profile_stats repo \
            --repo "$TARGET_REPOSITORY" \
            --theme "${{ inputs.theme }}" \
            --out "target/${{ inputs.output-dir }}"
      - name: Commit changed cards
        env:
          BRANCH: ${{ inputs.branch || github.ref_name }}
        run: |
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- "${{ inputs.output-dir }}"; then
            echo "No repository stats changes."
            exit 0
          fi
          git add "${{ inputs.output-dir }}"
          git commit -m "${{ inputs.commit-message }}"
          git push origin "HEAD:${BRANCH}"
