name: Secret scan (self)

# Calls the reusable workflow in this repository so pull requests test it. The
# reusable one is secret-scan.yml, so this caller needs a different file name.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    name: Secret scan
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/secret-scan.yml
