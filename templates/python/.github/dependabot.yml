# Copy to .github/dependabot.yml. Version updates are separate from the
# Dependabot alerts and security updates repository settings.
version: 2
updates:
  # EDIT: use "uv" for a uv.lock project, or "pip" for requirements files or
  # pyproject.toml without uv. Add one entry per directory that holds a manifest.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
