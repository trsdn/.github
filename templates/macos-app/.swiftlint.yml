# Copy to .swiftlint.yml at the repository root.
#
# This is a ratchet. The rule set is deliberately small, and every rule in it
# passes on the whole codebase today, so a violation is a regression rather than
# a backlog. CI runs `swiftlint lint --strict`, which fails on any violation.
# Formatting and style rules are left off on purpose: the compiler already
# enforces Swift concurrency checking with warnings as errors, and a style rule
# that the existing code breaks would only teach people to ignore the check.
#
# To adopt it in an existing app:
#
#   1. Run `swiftlint lint --strict` with this file as it stands.
#   2. Remove every rule that reports a violation you are not going to fix in the
#      same change. Never fix a large backlog to keep a rule; the point is that
#      the file describes what is true today.
#   3. Add a rule back only in the change that fixes its last violation. The set
#      grows as the code improves and never contains a rule that fails.
#
# TODO(included): list the directories that hold your Swift sources and tests.
only_rules:
  - force_cast
  - force_try
  - unused_optional_binding
  - unused_closure_parameter
  - empty_count
  - empty_string
  - redundant_optional_initialization
  - redundant_string_enum_value
  - duplicate_imports
  - trailing_whitespace
  - legacy_constructor
  - discarded_notification_center_observer
  - weak_delegate
  - unused_enumerated
  - overridden_super_call
  - unneeded_break_in_switch
  - redundant_discardable_let
  - unowned_variable_capture

included:
  - Sources
  - Tests
