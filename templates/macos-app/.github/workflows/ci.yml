name: CI

# Starting point for a Swift Package Manager macOS app. Copy to
# .github/workflows/ci.yml and replace every TODO(...) marker.
#
#   TODO(runners)       The macOS runner images to build on. A newer SDK can hide
#                       Swift concurrency errors that an older one reports, so
#                       building on both the pinned older image and `macos-latest`
#                       catches what one image alone misses. Drop to one image if
#                       the app supports only one macOS version.
#   TODO(lint)          The lint step below uses SwiftLint with a small rule set
#                       (see .swiftlint.yml). Replace it with `swift format lint
#                       --strict --recursive Sources Tests` if the project uses
#                       swift-format, or delete it if the project has no linter.
#   TODO(build)         `swift build` is right for a package. For an Xcode
#                       project, replace the build and test steps with
#                       `xcodebuild -scheme TODO(scheme) -destination
#                       'platform=macOS' SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
#                       build test`, and generate the project first if it is
#                       generated (for example `xcodegen generate`).
#
# Warnings are errors because the compiler's Swift 6 strict-concurrency
# diagnostics are the static check for the package. Treating them as errors keeps
# them from eroding. Release mode is what ships, so it is what gets built.
#
# This workflow covers the checks described in the standard's criteria S02, S03,
# S04 and S11; the README beside this kit says how.

on:
  pull_request:
  push:
    branches:
      # TODO(default-branch): change if the default branch is not `main`.
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # TODO(runners): see the note at the top of this file.
        runner:
          - macos-15
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build (release, warnings as errors)
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Lint
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          swiftlint lint --strict

      - name: Test
        run: swift test
