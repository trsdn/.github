name: Secret Scan

# Caller of the shared secret scan. Copy to .github/workflows/secret-scan.yml.
# It scans the tracked files and the commits a push or pull request adds.
#
#   TODO(default-branch)  Change `main` below if the default branch is named
#                         differently.
#   TODO(private)         The `if:` skips the scan in a private repository unless
#                         the repository variable ENABLE_PRIVATE_SECRET_SCAN is
#                         `true`. Delete the line to scan in a private repository
#                         unconditionally.
#
# After the first run, read the name of the check it produces on a pull request.
# A job that calls a shared workflow is reported as `<job> / <job in the shared
# workflow>`, and that full name is what a branch ruleset must require.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    if: ${{ !github.event.repository.private || vars.ENABLE_PRIVATE_SECRET_SCAN == 'true' }}
    uses: trsdn/.github/.github/workflows/secret-scan.yml@main
