# Only use this if you need an advanced workflow. CodeQL default setup already
# covers JavaScript and TypeScript, and the two cannot both be enabled: switch
# default setup off first. See docs/guides/codeql.md.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    # A called workflow cannot hold more permission than its caller grants.
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: trsdn/.github/.github/workflows/codeql.yml@main
    with:
      # One entry covers both JavaScript and TypeScript. A repository that also
      # holds Python or C# lists those here as well.
      languages: '["javascript-typescript"]'
