# Copy to .github/dependabot.yml. Version updates are separate from the
# Dependabot alerts and security updates repository settings.
version: 2
updates:
  # EDIT: add one npm entry per directory that holds a package.json.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # Minor and patch updates arrive as one pull request. Majors stay separate.
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
