# Linting configuration for the Python in this repository.
#
# The rule set stays close to Ruff's defaults on purpose. A strict configuration
# that nobody can satisfy gets suppressed rather than fixed, and a suppressed
# check is worse than no check because it looks like coverage.
#
# Ruff is a CI-only tool. It is pinned in the workflow and is not a dependency of
# the scripts, which remain runnable from a bare Python installation.

target-version = "py312"
line-length = 100

[lint]
# Defaults (E4, E7, E9, F) plus import sorting and a small set of correctness
# rules that catch real mistakes rather than matters of taste.
select = ["E4", "E7", "E9", "F", "I", "W", "B", "UP"]

[lint.per-file-ignores]
# The tests import their shared fixtures from the discovery start directory,
# which is on sys.path at runtime but is not an installed package.
"tests/*" = ["E402"]

[format]
docstring-code-format = true
